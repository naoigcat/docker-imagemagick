name: Bump Version

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.SSH_KEY }}
          fetch-depth: 0
      -
        name: Get tags
        run: |
          set -euo pipefail
          version_pattern='^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$'
          current_version=$(sed -n 's/^ARG IM_VERSION=//p' Dockerfile)
          if [[ ! "${current_version}" =~ ${version_pattern} ]]
          then
            echo "::error::Invalid Dockerfile IM_VERSION: ${current_version}"
            exit 1
          fi
          IM_VERSION=$(
            git ls-remote --tags https://github.com/ImageMagick/ImageMagick.git |
            grep -v '\^{}$' |
            awk -f <(cat - <<-'SCRIPT'
            {
              tag = $2
              sub(/^refs\/tags\//,"",tag)
              if (tag !~ /^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$/) {
                next
              }
              split(tag,versions,".")
              split(versions[3],patches,"-")
              print tag,versions[1],versions[2],patches[1],patches[2]
            }
            SCRIPT
            ) |
            sort -k 2,2n -k 3,3n -k 4,4n -k 5,5n |
            awk -v current_version="${current_version}" '
            $1 == current_version {
              found = 1
            }
            found && count < 2 {
              candidate = $1
              count++
            }
            END {
              if (found) {
                print candidate
              }
            }
            '
          )
          if [[ -z "${IM_VERSION}" ]]
          then
            echo "::error::Dockerfile IM_VERSION ${current_version} was not found in upstream tags"
            exit 1
          fi
          echo "IM_VERSION=${IM_VERSION}" | tee /dev/stderr >> "$GITHUB_ENV"
      -
        name: Compute tarball SHA256
        run: |
          set -euo pipefail
          URL="https://github.com/ImageMagick/ImageMagick/archive/refs/tags/${IM_VERSION}.tar.gz"
          curl -fsSL "$URL" -o /tmp/imagemagick.tar.gz
          IM_TARBALL_SHA256=$(sha256sum /tmp/imagemagick.tar.gz | awk '{print $1}')
          echo "IM_TARBALL_SHA256=${IM_TARBALL_SHA256}" | tee /dev/stderr >> "$GITHUB_ENV"
      -
        name: Bump
        id: bump
        run: |
          set -euo pipefail
          sed -i "s/^ARG IM_VERSION=.*/ARG IM_VERSION=${IM_VERSION}/" Dockerfile
          sed -i "s/^ARG IM_TARBALL_SHA256=.*/ARG IM_TARBALL_SHA256=${IM_TARBALL_SHA256}/" Dockerfile
          if git diff --quiet
          then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      -
        name: Verify build
        if: steps.bump.outputs.changed == 'true'
        run: docker build --pull -t imagemagick:${IM_VERSION} .
      -
        name: Commit and tag
        if: steps.bump.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump version to ${IM_VERSION}"
          git tag "${IM_VERSION}"
          git push origin HEAD
          git push origin "refs/tags/${IM_VERSION}"
